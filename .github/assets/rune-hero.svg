<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>RUNE — encrypted shared memory for AI agents</title>
  <defs>
    <linearGradient id="bg" x1="44" y1="16" x2="1212" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101f35"/>
      <stop offset="0.58" stop-color="#0a1728"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(245 210) rotate(90) scale(260 300)">
      <stop stop-color="#38e6c0" stop-opacity="0.2"/>
      <stop offset="0.62" stop-color="#1bc2a7" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#07111e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="430" y1="0" x2="1156" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5cffd6" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#5cffd6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#b8fff0" fill-opacity="0.08"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <rect width="560" height="420" fill="url(#glow)"/>

    <image href="rune-mark-official.png" x="44" y="15" width="352.8" height="374.4" preserveAspectRatio="xMidYMid meet"/>

    <rect x="430" y="58" width="340" height="36" rx="18" fill="#5cffd6" fill-opacity="0.08" stroke="#7ff5dd" stroke-opacity="0.3"/>
    <circle cx="450" cy="76" r="4" fill="#5cffd6"/>
    <text x="465" y="81" fill="#aafbeb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.35">ENCRYPTED ORGANIZATIONAL MEMORY</text>

    <text x="425" y="203" fill="#f5fbff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="108" font-weight="800" letter-spacing="7">RUNE</text>
    <text x="432" y="254" fill="#dce9f3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="600">Memory that outlives the conversation.</text>
    <text x="432" y="293" fill="#91a6b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18">Shared context for AI agents, private by design.</text>

    <rect x="430" y="327" width="738" height="1" fill="url(#line)"/>
    <text x="432" y="365" fill="#7ff5dd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.4">FHE ENCRYPTED</text>
    <circle cx="586" cy="360" r="2.5" fill="#587083"/>
    <text x="608" y="365" fill="#7ff5dd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.4">LOCAL EMBEDDINGS</text>
    <circle cx="797" cy="360" r="2.5" fill="#587083"/>
    <text x="819" y="365" fill="#7ff5dd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.4">MCP NATIVE</text>

    <circle cx="1138" cy="75" r="4" fill="#5cffd6" fill-opacity="0.65"/>
    <circle cx="1168" cy="75" r="4" fill="#5cffd6" fill-opacity="0.3"/>
    <circle cx="1198" cy="75" r="4" fill="#5cffd6" fill-opacity="0.12"/>
  </g>
</svg>
