# Regenerate from commands/claude/configure.md before re-enabling Codex/Gemini.
description = "Set up Rune credentials and write ~/.rune/config.json"
prompt = """
You are configuring Rune, an FHE-encrypted organizational memory system.

PREFERRED — registration string: if the user has a `runev1_…` string from their
Rune invite email, that is all they need. Call the configure MCP tool with
`{"registration_string": "runev1_…"}` and skip the manual collection below — the
server runs the 3-stage bootstrap (fetch+pin the Console CA, unwrap the one-time
handle into the real token, write config). Treat the string as a credential;
never echo it. Fall through to manual entry only when there is no string.

Manual fallback — collect the following from the user, one at a time:

1. **Console Endpoint** (required) — e.g. `tcp://console.rune.team:50051`
   - If the user enters a value without a scheme prefix (no `tcp://`, `http://`, or `https://`), auto-prepend `tcp://`.
2. **Console Token** (required) — an `evt_…` access token from the Console admin.

Then ask the TLS question:

**"How does your Console server handle TLS?"**

1. **Self-signed certificate** — "My team uses a self-signed CA"
   - Follow-up: ask for the path to CA certificate PEM file
   - Support `~` expansion in the path
   - Copy to `~/.rune/certs/ca.pem` (`mkdir -p ~/.rune/certs && cp <user_path> ~/.rune/certs/ca.pem && chmod 600 ~/.rune/certs/ca.pem`)
   - If copy fails (file not found, permission denied), show error and ask again
   - Inform user: "CA certificate copied to ~/.rune/certs/ca.pem"
   → config: `ca_cert: "~/.rune/certs/ca.pem"`, `tls_disable: false`

2. **Public CA (default)** — "Console uses a publicly-signed certificate (e.g., Let's Encrypt)"
   - No additional input needed, system CA handles verification
   → config: `ca_cert: ""`, `tls_disable: false`

3. **No TLS** — "Connect without TLS (not recommended)"
   - Show warning: "This should only be used for local development. All gRPC traffic will be sent in plaintext."
   → config: `ca_cert: ""`, `tls_disable: true`

After collecting credentials, run these shell commands:

```
mkdir -p ~/.rune && chmod 700 ~/.rune
```

Then write `~/.rune/config.json` with this structure (chmod 600 after writing):

```json
{
  "console": {"endpoint": "<console_endpoint>", "token": "<console_token>", "ca_cert": "<ca_cert or empty>", "tls_disable": false},
  "state": "dormant",
  "metadata": {"configVersion": "2.0", "lastUpdated": "<ISO timestamp>"}
}
```

Note: the FHE keys are never stored locally — the Console is the sole key holder and delivers the agent manifest (public EncKey + agent_dek) over the authenticated connection at session start.

After writing the config, show a summary:

```
Rune Configuration Complete
============================
  Config    : ~/.rune/config.json
  Console TLS : <enabled (system CA) | enabled (custom CA) | disabled>
  State     : dormant (run /rune:activate or $rune activate to enable)
```

User input: {{input}}
"""
